name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests app.py

      - name: Ruff format check
        run: ruff format --check src tests app.py
        continue-on-error: true      # formatting is advisory, lint errors are not

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing --junitxml=junit.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  pipeline:
    name: Reproduce DVC pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache DVC artefacts
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-${{ runner.os }}-${{ hashFiles('dvc.lock') }}
          restore-keys: dvc-${{ runner.os }}-

      # A real project pulls from remote storage. Without credentials in a fork,
      # the raw file is regenerated from its versioned, deterministic generator
      # (same md5 as the .dvc pointer). `dvc pull --allow-missing` exits 0 even
      # when nothing was fetched, so the fallback checks for the file itself.
      - name: Fetch data
        run: dvc pull --allow-missing || true; test -f data/raw/loan_applications.csv || python -m src.ingestion.generate_data

      - name: Reproduce the pipeline
        run: dvc repro --force

      - name: Show metrics
        run: |
          dvc metrics show --md >> "$GITHUB_STEP_SUMMARY" || true
          cat reports/metrics.json

      - name: Enforce the model quality gate
        run: python -m src.training.evaluate

      - name: Upload model artefacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model.joblib
            models/model_metadata.json
            reports/
          retention-days: 30

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Download model artefacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: loan-approval-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 8000:8000 loan-approval-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health | tee /dev/stderr
          curl -fs http://localhost:8000/ready  | tee /dev/stderr
          curl -fs -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"Gender":"Male","Married":"Yes","Dependents":"1","Education":"Graduate",
                 "Self_Employed":"No","ApplicantIncome":5849,"CoapplicantIncome":1500,
                 "LoanAmount":128,"Loan_Amount_Term":360,"Credit_History":1,
                 "Property_Area":"Urban"}' | tee /dev/stderr
          curl -fs http://localhost:8000/metrics | grep loan_predictions_total
          docker logs api
          docker rm -f api
