# Prometheus scrape configuration for the loan-approval service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: loan-approval-mlops

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Docker-compose target: the API container exposes /metrics on 8000.
  - job_name: loan-approval-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: loan-approval-api
          environment: local

  # Kubernetes target: discovers every pod carrying the scrape annotations set
  # in deployment/kubernetes/deployment.yaml.
  - job_name: loan-approval-api-k8s
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
