apiVersion: v1
kind: Service
metadata:
  name: loan-approval-api
  namespace: mlops
  labels:
    app: loan-approval-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app: loan-approval-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# NodePort variant for a local cluster (minikube / kind):
#   minikube service loan-approval-api-nodeport -n mlops
apiVersion: v1
kind: Service
metadata:
  name: loan-approval-api-nodeport
  namespace: mlops
  labels:
    app: loan-approval-api
spec:
  type: NodePort
  selector:
    app: loan-approval-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
