apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loan-approval-api
  namespace: mlops
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: loan-approval.local          # add to /etc/hosts for local clusters
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loan-approval-api
                port:
                  number: 80
