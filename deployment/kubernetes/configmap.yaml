apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-approval-config
  namespace: mlops
  labels:
    app: loan-approval-api
data:
  LOG_LEVEL: "INFO"
  API_PORT: "8000"
  # Point the pods at an in-cluster MLflow tracking server when one is running.
  MLFLOW_TRACKING_URI: "http://mlflow.mlops.svc.cluster.local:5000"
